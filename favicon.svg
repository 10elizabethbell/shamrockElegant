<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs>
  <path id="lf" d="M50 51C45 46 32 40 30.5 28 29.5 19 35 13.5 41 13.5 45.5 13.5 49 16.5 50 21 51 16.5 54.5 13.5 59 13.5 65 13.5 70.5 19 69.5 28 68 40 55 46 50 51Z"/>
  <g id="sham-shape">
    <use href="#lf"/><use href="#lf" transform="rotate(120 50 52)"/><use href="#lf" transform="rotate(-120 50 52)"/>
    <path d="M47.6 54C48.2 67 51.6 80.5 59.6 93.4c1.2 1.9 4.2.9 3.6-1.3C59.5 79.2 55.8 66.6 53.6 53.6Z"/>
    <circle cx="50" cy="52" r="4.6"/>
  </g>
  <mask id="sham-m" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><g fill="#fff"><use href="#sham-shape"/></g></mask>
  <radialGradient id="sham-g" gradientUnits="userSpaceOnUse" cx="50" cy="46" r="46">
    <stop offset="0" stop-color="#d7eee3" stop-opacity=".78"/>
    <stop offset=".5" stop-color="#9fd0ba" stop-opacity=".86"/>
    <stop offset="1" stop-color="#3f8a6c" stop-opacity=".97"/>
  </radialGradient>
  <radialGradient id="lobe-light"><stop offset="0" stop-color="#f4fbf7" stop-opacity=".7"/><stop offset="1" stop-color="#f4fbf7" stop-opacity="0"/></radialGradient>
  <filter id="sham-glass" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b"/>
    <feComposite in="SourceAlpha" in2="b" operator="arithmetic" k2="1" k3="-1" result="rim"/>
    <feFlood flood-color="#1f5d46" flood-opacity=".7"/>
    <feComposite in2="rim" operator="in" result="rimc"/>
    
    <feMerge result="glass"><feMergeNode in="SourceGraphic"/><feMergeNode in="rimc"/></feMerge>
    <feDropShadow in="glass" dx="0" dy="3" stdDeviation="3" flood-color="#134636" flood-opacity=".25"/>
  </filter>
  <g id="lobe-set">
    <ellipse cx="40" cy="24" rx="8" ry="8" fill="url(#lobe-light)"/><ellipse cx="60" cy="24" rx="8" ry="8" fill="url(#lobe-light)"/>
  </g>
  <g id="shamrock" filter="url(#sham-glass)">
    <g mask="url(#sham-m)">
      <rect width="100" height="100" fill="url(#sham-g)"/>
      <use href="#lobe-set"/><use href="#lobe-set" transform="rotate(120 50 52)"/><use href="#lobe-set" transform="rotate(-120 50 52)"/>
    </g>
  </g>
</defs>
<rect width="100" height="100" rx="22" fill="#0f4434"/><g transform="translate(7 5) scale(.86)"><use href="#shamrock"/></g></svg>